<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Timetable | UniLife</title>
    <link rel="stylesheet" href="timetable.css">
</head>

<body>

    <header class="header">
        <h1>My Weekly Timetable</h1>
        <p>Organize your university classes in one place</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2 id="formTitle">Add New Class</h2>

            <form id="timetableForm">

                <label for="course">Course Name</label>
                <input type="text" id="course"
                       placeholder="e.g. Biology" required>

                <label for="day">Day</label>
                <select id="day" required>
                    <option value="">Select Day</option>
                    <option>Monday</option>
                    <option>Tuesday</option>
                    <option>Wednesday</option>
                    <option>Thursday</option>
                    <option>Friday</option>
                </select>

                <label for="startTime">Start Time</label>
                <input type="time" id="startTime" required>

                <label for="endTime">End Time</label>
                <input type="time" id="endTime" required>

                <label for="classroom">Classroom</label>
                <input type="text" id="classroom"
                       placeholder="e.g. Room A205" required>

                <div class="form-buttons">
                    <button type="submit" id="saveBtn">
                        Add Class
                    </button>

                    <button type="button" id="cancelBtn"
                            class="cancel-btn" hidden>
                        Cancel
                    </button>
                </div>

                <p id="message"></p>

            </form>
        </section>

        <section class="schedule-section">
            <h2>Weekly Schedule</h2>

            <div class="timetable" id="timetable">

                <div class="day-column">
                    <h3>Monday</h3>
                    <div class="class-list" id="Monday"></div>
                </div>

                <div class="day-column">
                    <h3>Tuesday</h3>
                    <div class="class-list" id="Tuesday"></div>
                </div>

                <div class="day-column">
                    <h3>Wednesday</h3>
                    <div class="class-list" id="Wednesday"></div>
                </div>

                <div class="day-column">
                    <h3>Thursday</h3>
                    <div class="class-list" id="Thursday"></div>
                </div>

                <div class="day-column">
                    <h3>Friday</h3>
                    <div class="class-list" id="Friday"></div>
                </div>

            </div>
        </section>

    </main>

    <script src="timetable.js"></script>

</body>
</html>
